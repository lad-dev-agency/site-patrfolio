<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>MediSense — макет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  :root { --blue: #22b8ff; --violet: #7b5cff; --ink: #0f1b33; --muted: #66728a; --bg: #f3f6fb; --line: rgba(15,27,51,.08); --green: #19b97a; }
  .ff { font-family: "Onest", sans-serif; color: var(--ink); }

  /* ---------- чат (телефон) ---------- */
  .chat { background: var(--bg); }
  .ch-h { position: relative; z-index: 4; display: flex; align-items: center; gap: 12px; padding: 6px 18px 14px; background: rgba(255,255,255,.9); border-bottom: 1px solid var(--line); }
  .ch-h .back { font-size: 26px; color: var(--blue); width: 20px; }
  .bot-ava { position: relative; width: 44px; height: 44px; border-radius: 15px; background: linear-gradient(135deg, var(--blue), var(--violet)); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 20px; }
  .bot-ava::after { content: ""; position: absolute; right: -2px; bottom: -2px; width: 12px; height: 12px; border-radius: 50%; background: var(--green); border: 2.5px solid #fff; }
  .ch-h b { display: block; font-size: 17px; font-weight: 700; } .ch-h small { font-size: 13px; color: var(--green); font-weight: 600; }
  .ch-h .more { margin-left: auto; width: 38px; height: 38px; border-radius: 12px; background: var(--bg); display: grid; place-items: center; }
  .msgs { display: flex; flex-direction: column; gap: 10px; padding: 16px 16px 0; }
  .day { align-self: center; font-size: 12px; font-weight: 600; color: var(--muted); padding: 4px 12px; border-radius: 20px; background: rgba(15,27,51,.05); }
  .m { max-width: 82%; padding: 12px 15px; border-radius: 20px; font-size: 15px; line-height: 1.42; font-weight: 500; box-shadow: 0 2px 6px rgba(15,27,51,.05); }
  .m.bot { align-self: flex-start; background: #fff; border-bottom-left-radius: 6px; }
  .m.me { align-self: flex-end; color: #fff; background: linear-gradient(135deg, var(--blue), #4b8dff); border-bottom-right-radius: 6px; }
  .m .t { display: block; text-align: right; font-size: 11px; opacity: .6; margin-top: 4px; }
  .slots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .slots span { padding: 8px 12px; border-radius: 12px; border: 1.5px solid #d6e6fb; font-weight: 700; font-size: 14px; color: #2b6fd6; }
  .slots span.on { background: #e8f4ff; border-color: var(--blue); }
  .doc { display: flex; gap: 10px; align-items: center; margin-top: 10px; padding: 10px; border-radius: 14px; background: var(--bg); }
  .doc i { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(160deg, #ffd7c2, #f2a98a); position: relative; overflow: hidden; flex: none; }
  .doc i::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: -8px; height: 22px; border-radius: 50% 50% 0 0; background: #fff; }
  .doc b { display: block; font-size: 14px; } .doc small { font-size: 12px; color: var(--muted); font-weight: 600; }
  .ok { align-self: flex-start; width: 82%; border-radius: 20px; border-bottom-left-radius: 6px; background: #fff; overflow: hidden; box-shadow: 0 2px 6px rgba(15,27,51,.05); }
  .ok__top { padding: 12px 15px; background: linear-gradient(135deg, #e6fbf2, #e8f4ff); font-size: 15px; font-weight: 700; color: #0c7a52; }
  .ok__b { padding: 12px 15px; font-size: 14px; line-height: 1.6; color: var(--muted); font-weight: 600; }
  .ok__b b { color: var(--ink); }
  .ok__btn { margin: 0 12px 12px; padding: 10px; border-radius: 12px; text-align: center; font-weight: 700; font-size: 14px; color: #2b6fd6; background: #eef6ff; }
  .input { position: absolute; left: 12px; right: 12px; bottom: 28px; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 18px; border-radius: 26px; background: #fff; box-shadow: 0 10px 30px -10px rgba(15,27,51,.25); font-size: 15px; color: #9aa4b6; font-weight: 500; }
  .input span { flex: 1; }
  .input i { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, var(--blue), var(--violet)); display: grid; place-items: center; }

  /* ---------- сайт клініки ---------- */
  .site { position: relative; width: 1440px; height: 900px; background: #fff; overflow: hidden; }
  .s-nav { display: flex; align-items: center; gap: 40px; height: 86px; padding: 0 64px; border-bottom: 1px solid var(--line); }
  .s-logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 24px; letter-spacing: -.02em; }
  .s-logo i { width: 34px; height: 34px; border-radius: 11px; background: linear-gradient(135deg, var(--blue), var(--violet)); display: grid; place-items: center; color: #fff; font-style: normal; font-size: 22px; font-weight: 800; }
  .s-links { display: flex; gap: 30px; font-size: 16px; font-weight: 600; color: #3a4660; }
  .s-nav .tel { margin-left: auto; font-weight: 700; font-size: 16px; }
  .s-btn { padding: 14px 24px; border-radius: 14px; background: var(--ink); color: #fff; font-weight: 700; font-size: 15px; }
  .s-hero { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 56px 64px 0; }
  .s-hero .pill { display: inline-flex; gap: 8px; align-items: center; padding: 8px 14px; border-radius: 30px; background: #eef6ff; color: #2b6fd6; font-weight: 700; font-size: 14px; }
  .s-hero h1 { font-size: 66px; line-height: 1.02; letter-spacing: -.035em; font-weight: 800; margin: 22px 0 20px; }
  .s-hero h1 em { font-style: normal; background: linear-gradient(90deg, var(--blue), var(--violet)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .s-hero p { font-size: 19px; line-height: 1.55; color: var(--muted); max-width: 540px; }
  .s-search { display: flex; align-items: center; gap: 0; margin-top: 32px; padding: 8px; border-radius: 20px; background: #fff; border: 1px solid var(--line); box-shadow: 0 20px 40px -20px rgba(15,27,51,.25); max-width: 600px; }
  .s-search div { flex: 1; padding: 6px 16px; border-right: 1px solid var(--line); }
  .s-search div:nth-child(2) { border: 0; }
  .s-search small { display: block; font-size: 12px; color: var(--muted); font-weight: 700; } .s-search b { font-size: 16px; }
  .s-search span { padding: 16px 22px; border-radius: 14px; background: linear-gradient(135deg, var(--blue), var(--violet)); color: #fff; font-weight: 700; }
  .s-stats { display: flex; gap: 40px; margin-top: 36px; }
  .s-stats b { display: block; font-size: 32px; font-weight: 800; letter-spacing: -.02em; } .s-stats span { font-size: 14px; color: var(--muted); font-weight: 600; }
  .s-art { position: relative; height: 640px; border-radius: 36px; background: linear-gradient(160deg, #dff1ff, #ece6ff); overflow: hidden; }
  .s-art .cross { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); width: 260px; height: 260px; }
  .s-art .cross::before, .s-art .cross::after { content: ""; position: absolute; border-radius: 40px; background: linear-gradient(135deg, var(--blue), var(--violet)); box-shadow: 0 40px 60px -20px rgba(75,90,255,.5); }
  .s-art .cross::before { left: 85px; top: 0; width: 90px; height: 260px; }
  .s-art .cross::after { left: 0; top: 85px; width: 260px; height: 90px; }
  .s-art .ring { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); border-radius: 50%; border: 2px dashed rgba(75,140,255,.35); }
  .s-card { position: absolute; display: flex; align-items: center; gap: 12px; padding: 14px 18px 14px 14px; border-radius: 20px; background: #fff; box-shadow: 0 24px 40px -18px rgba(15,27,51,.3); }
  .s-card i { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-style: normal; font-size: 20px; }
  .s-card b { display: block; font-size: 16px; } .s-card small { font-size: 13px; color: var(--muted); font-weight: 600; }

  /* віджет поверх сайту */
  .widget { position: absolute; right: 40px; bottom: 30px; width: 380px; border-radius: 26px; overflow: hidden; background: var(--bg); box-shadow: 0 40px 80px -20px rgba(15,27,51,.45), 0 0 0 1px var(--line); }
  .widget .ch-h { padding-top: 16px; }
  .widget .msgs { padding-bottom: 76px; }
  .widget .input { bottom: 12px; }
  .widget .day, .widget .msgs > .m.me:nth-child(2), .widget .doc { display: none; }

  /* ---------- сцени ---------- */
  .cover { width: 1200px; height: 1100px; }
  .cover .phone { position: absolute; left: 330px; top: 40px; transform: rotate(5deg); }
  .float { position: absolute; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 16px 22px 16px 16px; border-radius: 22px; background: #fff; box-shadow: 0 30px 60px -20px rgba(0,0,0,.5); }
  .float i { width: 50px; height: 50px; border-radius: 16px; display: grid; place-items: center; font-style: normal; font-size: 22px; }
  .float small { display: block; font-size: 14px; color: var(--muted); font-weight: 600; } .float b { font-size: 19px; font-weight: 800; }
  .f1 { left: 40px; top: 300px; transform: rotate(-4deg); }
  .f2 { left: 790px; top: 640px; transform: rotate(3deg); }

  .gal { position: relative; width: 1520px; padding: 40px; }


</style>
</head>
<body>

<template id="conv">
  <div class="msgs">
    <span class="day">Сьогодні</span>
    <div class="m me">Добрий день! Після бігу коле в грудях. До кого записатися?<span class="t">09:41</span></div>
    <div class="m bot">Раджу почати з <b>кардіолога</b>. Найближчі вільні слоти на Оболоні:
      <div class="slots"><span class="on">Завтра 10:30</span><span>Завтра 14:00</span><span>Пт 09:15</span></div>
      <div class="doc"><i></i><div><b>Ірина Мельник</b><small>кардіолог · ★ 4,9 · 14 років</small></div></div>
    </div>
    <div class="m me">10:30 👍<span class="t">09:42</span></div>
    <div class="ok"><div class="ok__top">✅ Вас записано!</div>
      <div class="ok__b"><b>Завтра, 19 листопада, 10:30</b><br>Кардіолог · каб. 214, вул. Героїв Дніпра 3<br>Нагадаю за 2 години до візиту</div>
      <div class="ok__btn">Додати в календар</div></div>
  </div>
</template>

<template id="chat" data-class="ff chat">
  <div class="ch-h"><span class="back">‹</span><span class="bot-ava">✦</span><div><b>Асистент MediSense</b><small>онлайн · відповідає миттєво</small></div><span class="more"><svg width="18" height="18" viewBox="0 0 24 24" fill="#0f1b33"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></span></div>
  <div data-clone="conv"></div>
  <div class="input"><span>Напишіть повідомлення…</span><i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></i></div>
</template>

<template id="site">
  <div class="site ff">
    <nav class="s-nav"><span class="s-logo"><i>+</i>MediSense</span>
      <span class="s-links"><span>Лікарі</span><span>Послуги</span><span>Аналізи</span><span>Філії</span><span>Ціни</span></span>
      <span class="tel">0 800 300 214</span><span class="s-btn">Записатися</span></nav>
    <section class="s-hero">
      <div>
        <span class="pill">● 14 клінік у Києві та області</span>
        <h1>Турбота, на яку <em>не треба чекати</em></h1>
        <p>Запис до лікаря за 30 секунд — на сайті, в Telegram чи Viber. Наш AI-асистент підбере спеціаліста і зручний час 24/7.</p>
        <div class="s-search"><div><small>Спеціаліст</small><b>Кардіолог</b></div><div><small>Філія</small><b>Оболонь</b></div><span>Знайти час</span></div>
        <div class="s-stats"><div><b>180+</b><span>лікарів</span></div><div><b>4,9 ★</b><span>Google, 8 200 відгуків</span></div><div><b>24/7</b><span>онлайн-запис</span></div></div>
      </div>
      <div class="s-art">
        <i class="ring" style="width:460px;height:460px"></i><i class="ring" style="width:600px;height:600px"></i>
        <i class="cross"></i>
        <div class="s-card" style="left:36px;top:40px"><i style="background:#e6fbf2">🩺</i><div><b>Чек-ап серця</b><small>ЕКГ + УЗД + консультація</small></div></div>
        <div class="s-card" style="right:30px;top:250px"><i style="background:#eef6ff">⏱</i><div><b>Без черг</b><small>середнє очікування 4 хв</small></div></div>
      </div>
    </section>
    <div class="widget ff">
      <div class="ch-h"><span class="bot-ava">✦</span><div><b>Асистент MediSense</b><small>онлайн</small></div><span class="more">✕</span></div>
      <div data-clone="conv"></div>
      <div class="input"><span>Напишіть повідомлення…</span><i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></i></div>
    </div>
  </div>
</template>

<div class="stage">
  <div class="scene cover" data-shot="cover">
    <div class="phone" data-screen="chat"></div>
    <div class="float f1 ff"><i style="background:linear-gradient(135deg,#22b8ff,#7b5cff);color:#fff">✦</i><div><small>Оброблено без оператора</small><b>70% звернень</b></div></div>
    <div class="float f2 ff"><i style="background:#e6fbf2">📅</i><div><small>Нагадування · завтра</small><b>Кардіолог, 10:30</b></div></div>
  </div>

  <div class="scene gal" data-shot="screens">
    <div class="browser"><div class="browser__bar"><span class="dots"><i></i><i></i><i></i></span><span class="url">medisense.ua</span></div><div data-clone="site"></div></div>
  </div>
</div>

<script>
  /* вкладені клони: спершу розгортаємо conv усередині інших шаблонів */
  document.querySelectorAll("template").forEach((t) => {
    t.content.querySelectorAll('[data-clone="conv"]').forEach((el) => { el.innerHTML = document.getElementById("conv").innerHTML; el.removeAttribute("data-clone"); });
  });
</script>
<script src="shared.js"></script>
</body>
</html>
