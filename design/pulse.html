<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Pulse Analytics — макет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  :root {
    --bg: #0e0e13; --panel: #15151c; --panel-2: #1b1b24; --line: rgba(255,255,255,.07); --text: #f2f2f6; --muted: #8b8b9a; --dim: #5c5c6a;
    --pink: #e8438f; --orange: #f59a3c; --green: #34d399; --red: #ff5d6c; --blue: #5b8cff;
  }
  .dash { width: 1440px; height: 920px; display: grid; grid-template-columns: 232px 1fr; font-family: "Inter", sans-serif; color: var(--text); background: var(--bg); font-feature-settings: "tnum" 1, "cv11" 1; }

  /* sidebar */
  .side { padding: 24px 16px; border-right: 1px solid var(--line); background: #101016; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 26px; font-weight: 800; font-size: 20px; letter-spacing: -.02em; }
  .brand i { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg, var(--pink), var(--orange)); display: grid; place-items: center; }
  .grp { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--dim); padding: 14px 12px 8px; text-transform: uppercase; }
  .nv { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; font-size: 14px; font-weight: 500; color: #a9a9b8; }
  .nv svg { stroke: currentColor; }
  .nv.on { background: var(--panel-2); color: #fff; box-shadow: inset 0 0 0 1px var(--line); }
  .nv .cnt { margin-left: auto; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 10px; background: rgba(232,67,143,.18); color: #ff8cc0; }
  .upg { margin-top: auto; padding: 16px; border-radius: 14px; background: linear-gradient(160deg, rgba(232,67,143,.2), rgba(245,154,60,.12)); border: 1px solid rgba(232,67,143,.25); font-size: 13px; color: #d9d9e3; line-height: 1.45; }
  .upg b { display: block; color: #fff; font-size: 14px; margin-bottom: 4px; }

  /* main */
  .main { padding: 22px 28px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .top { display: flex; align-items: center; gap: 14px; }
  .top h1 { font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
  .top h1 small { display: block; font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: 0; margin-top: 2px; }
  .sp { flex: 1; }
  .ctl { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; font-weight: 600; color: #cfcfda; }
  .ctl.live { color: var(--green); }
  .ctl.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(52,211,153,.18); }
  .ctl.pri { background: #fff; color: #0e0e13; border-color: #fff; }
  .ava { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, #5b8cff, #a77bff); }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .kpi { position: relative; padding: 18px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
  .kpi small { font-size: 13px; color: var(--muted); font-weight: 500; }
  .kpi b { display: block; margin: 8px 0 10px; font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
  .chg { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 20px; }
  .up { color: var(--green); background: rgba(52,211,153,.12); } .down { color: var(--red); background: rgba(255,93,108,.12); }
  .kpi .vs { font-size: 12px; color: var(--dim); margin-left: 6px; }
  .kpi svg.mini { position: absolute; right: 14px; bottom: 16px; }
  .kpi.ai { background: linear-gradient(150deg, rgba(232,67,143,.22), rgba(245,154,60,.1) 60%, var(--panel)); border-color: rgba(232,67,143,.3); }
  .ai-tag { position: absolute; right: 14px; top: 14px; font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 8px; background: linear-gradient(90deg, var(--pink), var(--orange)); }

  .row { display: grid; grid-template-columns: 1fr 340px; gap: 14px; min-height: 0; }
  .card { padding: 18px 20px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); }
  .card__h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .card__h h3 { font-size: 15px; font-weight: 700; }
  .card__h h3 small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; margin-top: 3px; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 3px; border-radius: 2px; }
  .seg { display: flex; padding: 3px; border-radius: 9px; background: var(--bg); border: 1px solid var(--line); }
  .seg span { padding: 5px 10px; border-radius: 7px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .seg span.on { background: var(--panel-2); color: #fff; }
  .axis text { font: 500 11px "Inter"; fill: #5c5c6a; }
  .tip { position: absolute; padding: 10px 12px; border-radius: 10px; background: #23232e; border: 1px solid rgba(255,255,255,.12); font-size: 12px; color: var(--muted); box-shadow: 0 14px 30px -8px rgba(0,0,0,.6); }
  .tip b { display: block; font-size: 15px; color: #fff; margin-top: 2px; }

  .stores li { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .stores li:last-child { border: 0; }
  .stores .n { color: var(--dim); font-weight: 700; font-family: "JetBrains Mono", monospace; font-size: 12px; }
  .stores .t b { display: block; font-weight: 600; }
  .stores .t .bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,.06); margin-top: 6px; }
  .stores .t .bar s { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--pink), var(--orange)); }
  .stores .v { text-align: right; font-weight: 700; } .stores .v small { display: block; font-size: 11px; font-weight: 700; }

  .row2 { display: grid; grid-template-columns: 1.15fr 1fr 340px; gap: 14px; }
  .heat { display: grid; grid-template-columns: 26px repeat(12, 1fr); gap: 4px; font-size: 10px; color: var(--dim); font-weight: 600; align-items: center; }
  .heat i { height: 18px; border-radius: 4px; }
  .cats li { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 13px; }
  .cats li i { width: 10px; height: 10px; border-radius: 3px; }
  .cats li span { flex: 1; color: #cfcfda; }
  .cats li b { font-weight: 700; } .cats li em { font-style: normal; font-size: 12px; font-weight: 700; width: 48px; text-align: right; }
  .alert { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 1.4; color: #cfcfda; }
  .alert:last-child { border: 0; }
  .alert i { flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-style: normal; font-size: 14px; }
  .alert b { color: #fff; font-weight: 600; } .alert small { display: block; color: var(--dim); font-size: 11px; margin-top: 3px; font-weight: 600; }

  /* ---------- сцени ---------- */
  .cover { width: 1560px; height: 1000px; perspective: 2400px; }
  .cover .tilt { position: absolute; left: 150px; top: 80px; width: 1520px; transform: rotateX(12deg) rotateY(-20deg) rotateZ(2deg) scale(.86); transform-origin: 30% 40%; transform-style: preserve-3d; }
  .floater { position: absolute; z-index: 5; font-family: "Inter", sans-serif; color: var(--text); border-radius: 18px; background: rgba(27,27,36,.92); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 40px 80px -24px rgba(0,0,0,.75); }
  .fl-alert { left: 40px; top: 560px; width: 420px; padding: 18px 20px; display: flex; gap: 14px; transform: rotate(-3deg); }
  .fl-alert i { flex: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: #4a154b; font-style: normal; }
  .fl-alert small { display: block; font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
  .fl-alert p { font-size: 16px; line-height: 1.4; color: #e3e3ea; } .fl-alert b { color: #fff; }
  .fl-kpi { left: 1130px; top: 40px; padding: 18px 22px; transform: rotate(4deg); }
  .fl-kpi small { font-size: 13px; color: var(--muted); font-weight: 600; }
  .fl-kpi b { display: block; font-size: 34px; font-weight: 800; letter-spacing: -.02em; margin: 4px 0 6px; background: linear-gradient(90deg, var(--pink), var(--orange)); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .flat { width: 1520px; padding: 40px; }
</style>
</head>
<body>

<template id="dash">

          <svg class="mini" width="90" height="34" viewBox="0 0 90 34"><path d="M0 22 L12 26 24 18 36 22 48 14 60 18 72 10 90 12" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round"/></svg></div>
        <div class="kpi"><small>Середній чек</small><b>₴258,40</b><span class="chg down">↓ 2,1%</span><span class="vs">vs жовтень</span>
          <svg class="mini" width="90" height="34" viewBox="0 0 90 34"><path d="M0 8 L12 10 24 6 36 14 48 12 60 20 72 18 90 24" fill="none" stroke="#ff5d6c" stroke-width="2.2" stroke-linecap="round"/></svg></div>

      <div class="row">

            <div style="display:flex;gap:18px;align-items:center"><div class="legend"><span><i style="background:linear-gradient(90deg,#e8438f,#f59a3c)"></i>Факт</span><span><i style="background:repeating-linear-gradient(90deg,#f59a3c 0 4px,transparent 4px 7px)"></i>Прогноз</span><span><i style="background:#3a3a48"></i>Минулий рік</span></div>
            <div class="seg"><span>7д</span><span class="on">30д</span><span>Рік</span></div></div></div>
          <svg width="100%" height="270" viewBox="0 0 800 270" preserveAspectRatio="none" class="axis">
            <defs>
              <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8438f"/><stop offset="1" stop-color="#f59a3c"/></linearGradient>

            <path d="M40 170 C70 160 90 150 120 155 S170 120 200 128 250 100 280 110 330 80 360 92 410 70 440 76 490 50 520 62" fill="none" stroke="url(#lg)" stroke-width="3" stroke-linecap="round"/>
            <path d="M520 62 C560 54 590 40 620 48 S680 30 710 36 760 18 800 22" fill="none" stroke="#f59a3c" stroke-width="2.6" stroke-dasharray="7 6" stroke-linecap="round"/>

            <line x1="520" y1="20" x2="520" y2="230" stroke="rgba(255,255,255,.2)" stroke-dasharray="3 4"/>
            <circle cx="490" cy="50" r="6" fill="#0e0e13" stroke="#f59a3c" stroke-width="3"/>
            <g><text x="40" y="258">1 лис</text><text x="190" y="258">5</text><text x="330" y="258">10</text><text x="470" y="258">15</text><text x="510" y="246" style="fill:#8b8b9a">сьогодні</text><text x="620" y="258">22</text><text x="760" y="258">30</text></g>
          </svg>
          <div class="tip" style="left:458px;top:76px">17 листопада<b>₴582 340</b><span style="color:#34d399;font-weight:700">↑ 24% до 2025</span></div>
        </div>

        <div class="card">
          <div class="card__h"><h3>Топ магазинів<small>за виручкою, листопад</small></h3><span class="ctl" style="height:30px;font-size:12px">Усі ⌄</span></div>

            <li><span class="n">01</span><span class="t"><b>Київ · ТРЦ Respublika</b><span class="bar"><s style="width:100%"></s></span></span><span class="v">₴1,24 млн<small class="up" style="background:none">+22%</small></span></li>

  <div class="scene cover" data-shot="cover">

      <div><small>#sales-alerts · Pulse AI</small><p><b>Ocean Plaza: −23%</b> продажів за 3 дні. Рекомендація: повернути акцію на категорію «Напої».</p></div></div>

  </div>

  <div class="scene flat" data-shot="dashboard">
    <div class="browser"><div class="browser__bar dark"><span class="dots"><i></i><i></i><i></i></span><span class="url">app.pulse.ua/overview</span></div><div data-clone="dash"></div></div>
  </div>
</div>

<script>
  /* теплова карта: 7 днів × 12 годин (8:00–20:00) — заповнюємо шаблон до клонування */
  (function () {
    const tpl = document.getElementById("dash").content;
    const heat = tpl.getElementById("heat");
    const days = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Нд"];
    const peak = (d, h) => {
      const base = Math.exp(-((h - 10) ** 2) / 6) * .55 + Math.exp(-((h - 18) ** 2) / 5) * .9; // ранок і вечір
      const wk = d >= 5 ? 1.15 : d === 4 ? 1.08 : .9;
      return Math.min(1, base * wk + ((d * 7 + h * 3) % 5) * .03);
    };
    let html = "";
    days.forEach((d, di) => {
      html += `<span>${d}</span>`;
      for (let h = 0; h < 12; h++) {
        const v = peak(di, h + 8);
        html += `<i style="background:color-mix(in srgb, #e8438f ${Math.round(v * 100)}%, #1f1f29)"></i>`;
      }
    });
    heat.innerHTML = html;
  })();
</script>
<script src="shared.js"></script>
</body>
</html>
