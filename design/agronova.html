<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>AgroNova — макет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  :root { --bg: #0b0f0d; --panel: #111714; --panel-2: #17201b; --line: rgba(255,255,255,.07); --text: #eef3ef; --muted: #85948b; --dim: #56635b;
    --lime: #9ae65c; --blue: #22b8ff; --amber: #ffc24b; --red: #ff6b6b; }
  .ff { font-family: "Inter", sans-serif; color: var(--text); font-feature-settings: "tnum" 1; }
  .mono { font-family: "JetBrains Mono", monospace; }

  .dash { width: 1440px; height: 900px; display: grid; grid-template-columns: 220px 1fr; background: var(--bg); }
  .side { padding: 22px 14px; border-right: 1px solid var(--line); background: #090c0b; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 24px; font-weight: 800; font-size: 18px; letter-spacing: -.02em; }
  .brand i { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg, var(--lime), var(--blue)); display: grid; place-items: center; }
  .brand small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .06em; }
  .env { display: flex; padding: 3px; margin: 0 4px 18px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
  .env span { flex: 1; text-align: center; padding: 7px 0; border-radius: 8px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .env span.on { background: rgba(154,230,92,.14); color: var(--lime); }
  .grp { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--dim); padding: 12px 10px 6px; text-transform: uppercase; }
  .nv { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 9px; font-size: 14px; font-weight: 500; color: #a7b3ab; }
  .nv.on { background: var(--panel-2); color: #fff; box-shadow: inset 0 0 0 1px var(--line); }
  .nv svg { stroke: currentColor; }
  .nv em { margin-left: auto; font-style: normal; font-size: 11px; font-weight: 700; color: var(--lime); }

  .main { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .top { display: flex; align-items: center; gap: 10px; }
  .top h1 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin-right: auto; }
  .top h1 small { display: block; font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: 0; margin-top: 2px; }
  .ok { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 10px; background: rgba(154,230,92,.1); border: 1px solid rgba(154,230,92,.3); color: var(--lime); font-size: 13px; font-weight: 700; }
  .ok::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 4px rgba(154,230,92,.2); }
  .ctl { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 13px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; font-weight: 600; color: #cdd6d0; }

  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .st { padding: 15px 16px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); position: relative; overflow: hidden; }
  .st small { font-size: 12px; color: var(--muted); font-weight: 600; }
  .st b { display: block; font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 6px 0 4px; }
  .st b u { text-decoration: none; font-size: 15px; color: var(--muted); font-weight: 600; margin-left: 2px; }
  .st span { font-size: 12px; font-weight: 700; }
  .g { color: var(--lime); } .bl { color: var(--blue); } .am { color: var(--amber); }
  .st.cost { background: linear-gradient(150deg, rgba(154,230,92,.16), rgba(34,184,255,.08) 70%, var(--panel)); border-color: rgba(154,230,92,.28); }

  .row { display: grid; grid-template-columns: 1fr 360px; gap: 12px; }
  .card { padding: 16px 18px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
  .card__h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .card__h h3 { font-size: 14px; font-weight: 700; } .card__h h3 small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; margin-top: 2px; }
  .lg { display: flex; gap: 14px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .lg span { display: flex; align-items: center; gap: 6px; } .lg i { width: 12px; height: 3px; border-radius: 2px; }
  .axis text { font: 500 11px "Inter"; fill: #56635b; }
  .ann { position: absolute; padding: 8px 10px; border-radius: 9px; background: #1d2822; border: 1px solid rgba(255,255,255,.12); font-size: 11px; color: var(--muted); font-weight: 600; }
  .ann b { display: block; color: #fff; font-size: 13px; }

  .svc li { display: grid; grid-template-columns: 10px 1fr auto 62px; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .svc li:last-child { border: 0; }
  .svc .d { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 3px rgba(154,230,92,.15); }
  .svc .d.w { background: var(--amber); box-shadow: 0 0 0 3px rgba(255,194,75,.15); }
  .svc b { font-weight: 600; } .svc .v { font-size: 11px; color: var(--muted); }

  .row2 { display: grid; grid-template-columns: 1.25fr 1fr 360px; gap: 12px; }
  .dep li { display: flex; gap: 10px; align-items: center; padding: 11px 0; font-size: 13px; border-bottom: 1px solid var(--line); }
  .dep li:last-child { border: 0; }
  .dep b { white-space: nowrap; }
  .dep li > span:nth-child(4) { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #a7b3ab; }
  .dep .c { font-size: 12px; color: var(--blue); }
  .dep .t { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .dep .ic { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: rgba(154,230,92,.14); color: var(--lime); }
  .nodes { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .nodes i { height: 46px; border-radius: 8px; display: grid; place-items: center; font: 600 11px "JetBrains Mono"; color: #0b0f0d; font-style: normal; }
  .bars { display: flex; align-items: flex-end; gap: 10px; height: 168px; padding-top: 6px; }
  .bars div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-weight: 600; }
  .bars s { display: block; width: 100%; border-radius: 6px 6px 3px 3px; background: #2a3530; }
  .bars .n s { background: linear-gradient(180deg, var(--lime), #5fb23a); }

  /* термінал */
  .term { width: 560px; border-radius: 16px; overflow: hidden; background: #0d1210; border: 1px solid rgba(255,255,255,.12); box-shadow: 0 50px 100px -30px rgba(0,0,0,.8); }
  .term__bar { display: flex; align-items: center; gap: 14px; height: 40px; padding: 0 14px; background: #151c18; border-bottom: 1px solid var(--line); font: 600 12px "Inter"; color: var(--muted); }
  .term__bar .dots i { width: 11px; height: 11px; }
  .term pre { margin: 0; padding: 18px 20px 20px; font: 400 14.5px/1.75 "JetBrains Mono", monospace; color: #c9d4cd; white-space: pre; }
  .term .p { color: var(--lime); } .term .m { color: var(--dim); } .term .b { color: var(--blue); } .term .y { color: var(--amber); } .term .w { color: #fff; font-weight: 700; }

  /* ---------- сцени ---------- */
  .cover { width: 1600px; height: 1000px; perspective: 2400px; }
  .cover .tilt { position: absolute; left: 260px; top: 60px; width: 1520px; transform: rotateX(10deg) rotateY(20deg) rotateZ(-2deg) scale(.84); transform-origin: 70% 40%; }
  .cover .term { position: absolute; z-index: 5; left: 40px; top: 430px; transform: rotate(-2deg); }
  .cover .chip { position: absolute; z-index: 5; left: 1180px; top: 720px; display: flex; gap: 14px; align-items: center; padding: 16px 22px 16px 16px; border-radius: 22px; background: rgba(23,32,27,.95); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 30px 60px -20px rgba(0,0,0,.7); transform: rotate(3deg); }
  .chip i { width: 50px; height: 50px; border-radius: 16px; display: grid; place-items: center; font-style: normal; font-size: 22px; background: rgba(154,230,92,.14); color: var(--lime); font-weight: 800; }
  .chip small { display: block; font-size: 14px; color: var(--muted); font-weight: 600; } .chip b { font-size: 20px; font-weight: 800; }
  .flat { width: 1520px; padding: 40px; }
</style>
</head>
<body>

<template id="dash">
  <div class="dash ff">
    <aside class="side">
      <div class="brand"><i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0b0f0d" stroke-width="2.6" stroke-linecap="round"><path d="M12 21V9M12 13c-4 0-6-3-6-7 4 0 6 3 6 7zM12 11c0-4 2-7 6-7 0 4-2 7-6 7z"/></svg></i><div>AgroNova<small>OPS CONSOLE</small></div></div>
      <div class="env"><span class="on">prod</span><span>stage</span><span>dev</span></div>
      <div class="grp">Моніторинг</div>
      <div class="nv on"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Огляд</div>
      <div class="nv"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg>Сервіси<em>12/12</em></div>
      <div class="nv"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 3v18h18M7 15l4-4 3 3 6-6"/></svg>Метрики</div>
      <div class="nv"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Логи</div>
      <div class="nv"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/></svg>Алерти<em>0</em></div>
      <div class="grp">Доставка</div>
      <div class="nv"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M6 8.5v7M8.3 7l7.4 4M8.3 17l7.4-4"/></svg>Пайплайни</div>
      <div class="nv"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M7 18a4 4 0 0 1-.6-8A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"/></svg>Інфраструктура</div>
      <div class="nv"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .9-3 2.2 0 3 6 1.6 6 4.6 0 1.3-1.3 2.2-3 2.2-1.4 0-2.6-.6-3-1.6M12 6v2M12 16v2"/></svg>Витрати</div>
    </aside>

    <main class="main">
      <div class="top"><h1>Production · eu-central-1<small>Сезон жнив · пікове навантаження ×6</small></h1>
        <span class="ok">Усі системи працюють</span><span class="ctl">Останні 24 год ⌄</span><span class="ctl">⟳ 10 с</span></div>

      <div class="stats">
        <div class="st"><small>Аптайм (90 днів)</small><b>99,99<u>%</u></b><span class="g">0 інцидентів</span></div>
        <div class="st"><small>Запитів / с</small><b>2 840</b><span class="bl">пік 5 120 о 14:00</span></div>
        <div class="st"><small>Затримка p95</small><b>118<u>мс</u></b><span class="g">↓ 64% після міграції</span></div>
        <div class="st"><small>Помилки 5xx</small><b>0,02<u>%</u></b><span class="g">SLO 0,5%</span></div>
        <div class="st cost"><small>AWS / місяць</small><b>$3 120</b><span class="g">↓ 48% до on-prem</span></div>
      </div>

      <div class="row">
        <div class="card" style="position:relative">
          <div class="card__h"><h3>Навантаження та затримка<small>усі сервіси · автомасштабування EKS</small></h3>
            <div class="lg"><span><i style="background:#9ae65c"></i>Запити/с</span><span><i style="background:#22b8ff"></i>p95, мс</span><span><i style="background:#56635b"></i>Ноди</span></div></div>
          <svg width="100%" height="250" viewBox="0 0 760 250" preserveAspectRatio="none" class="axis">
            <defs><linearGradient id="ag1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ae65c" stop-opacity=".35"/><stop offset="1" stop-color="#9ae65c" stop-opacity="0"/></linearGradient></defs>
            <g stroke="rgba(255,255,255,.05)"><path d="M36 20H760M36 75H760M36 130H760M36 185H760"/></g>
            <text x="0" y="24">6k</text><text x="0" y="79">4k</text><text x="0" y="134">2k</text><text x="4" y="189">0</text>
            <!-- ноди (сходинки) -->
            <path d="M36 190 H200 V176 H260 V160 H330 V140 H440 V160 H520 V176 H600 V190 H760" fill="none" stroke="#56635b" stroke-width="2" stroke-dasharray="4 4"/>
            <path d="M36 172 C80 168 120 160 160 150 S230 110 270 90 330 40 380 36 450 60 490 90 560 130 610 150 690 166 760 168 L760 200 L36 200Z" fill="url(#ag1)"/>
            <path d="M36 172 C80 168 120 160 160 150 S230 110 270 90 330 40 380 36 450 60 490 90 560 130 610 150 690 166 760 168" fill="none" stroke="#9ae65c" stroke-width="2.6"/>
            <path d="M36 150 C90 152 140 148 190 150 S260 140 300 146 360 136 400 142 470 150 520 146 600 152 660 148 720 150 760 149" fill="none" stroke="#22b8ff" stroke-width="2"/>
            <circle cx="380" cy="36" r="5" fill="#0b0f0d" stroke="#9ae65c" stroke-width="2.5"/>
            <g><text x="36" y="232">00:00</text><text x="186" y="232">06:00</text><text x="366" y="232">12:00</text><text x="546" y="232">18:00</text><text x="716" y="232">24:00</text></g>
          </svg>
          <div class="ann" style="left:410px;top:58px">14:02 · пік жнив<b>5 120 rps · p95 124 мс</b><span class="g">+8 нод автоматично</span></div>
        </div>
        <div class="card">
          <div class="card__h"><h3>Сервіси<small>12 у кластері</small></h3><span class="ctl" style="height:28px;font-size:12px">Усі ⌄</span></div>
          <ul class="svc">
            <li><i class="d"></i><span><b>harvest-api</b><br><span class="v mono">v2.14.0 · 8 подів</span></span><span class="g" style="font-size:12px;font-weight:700">99,99%</span><svg width="62" height="22" viewBox="0 0 62 22"><path d="M0 16 8 14 16 15 24 9 32 11 40 6 48 8 62 4" fill="none" stroke="#9ae65c" stroke-width="1.8"/></svg></li>
            <li><i class="d"></i><span><b>field-sensors</b><br><span class="v mono">v1.8.3 · 6 подів</span></span><span class="g" style="font-size:12px;font-weight:700">100%</span><svg width="62" height="22" viewBox="0 0 62 22"><path d="M0 12 8 11 16 13 24 10 32 12 40 9 48 11 62 10" fill="none" stroke="#9ae65c" stroke-width="1.8"/></svg></li>
            <li><i class="d"></i><span><b>grain-ledger</b><br><span class="v mono">v3.2.1 · 4 поди</span></span><span class="g" style="font-size:12px;font-weight:700">99,98%</span><svg width="62" height="22" viewBox="0 0 62 22"><path d="M0 14 8 15 16 12 24 13 32 9 40 10 48 7 62 8" fill="none" stroke="#9ae65c" stroke-width="1.8"/></svg></li>
            <li><i class="d w"></i><span><b>reports-worker</b><br><span class="v mono">v1.4.0 · черга 1 240</span></span><span class="am" style="font-size:12px;font-weight:700">масштаб.</span><svg width="62" height="22" viewBox="0 0 62 22"><path d="M0 18 8 16 16 12 24 8 32 5 40 7 48 10 62 12" fill="none" stroke="#ffc24b" stroke-width="1.8"/></svg></li>
            <li><i class="d"></i><span><b>auth</b><br><span class="v mono">v2.0.7 · 3 поди</span></span><span class="g" style="font-size:12px;font-weight:700">100%</span><svg width="62" height="22" viewBox="0 0 62 22"><path d="M0 11 8 12 16 11 24 12 32 11 40 12 48 11 62 11" fill="none" stroke="#9ae65c" stroke-width="1.8"/></svg></li>
          </ul>
        </div>
      </div>

      <div class="row2">
        <div class="card">
          <div class="card__h"><h3>Останні релізи<small>GitLab CI → EKS, без простоїв</small></h3><span class="ctl" style="height:28px;font-size:12px">7 сьогодні</span></div>
          <ul class="dep">
            <li><span class="ic">✓</span><b>harvest-api</b><span class="c mono">a3f9c21</span><span>Прогноз врожаю по полях</span><span class="t">14 хв 52 с · 12:40</span></li>
            <li><span class="ic">✓</span><b>grain-ledger</b><span class="c mono">7be04d8</span><span>Експорт у 1С</span><span class="t">11 хв 08 с · 10:15</span></li>
            <li><span class="ic">✓</span><b>auth</b><span class="c mono">0c4d19e</span><span>Оновлення залежностей</span><span class="t">6 хв 12 с · 08:30</span></li>
            <li><span class="ic">✓</span><b>field-sensors</b><span class="c mono">e21a6f0</span><span>Нові датчики вологості</span><span class="t">9 хв 31 с · 09:02</span></li>
          </ul>
        </div>
        <div class="card">
          <div class="card__h"><h3>Ноди EKS · CPU<small>18 активних із 24</small></h3></div>
          <div class="nodes" id="nodes"></div>
        </div>
        <div class="card">
          <div class="card__h"><h3>Витрати на інфраструктуру<small>тис. $ / міс</small></h3></div>
          <div class="bars">
            <div><s style="height:124px"></s>Тра</div><div><s style="height:130px"></s>Чер</div><div><s style="height:127px"></s>Лип</div>
            <div class="n"><s style="height:76px"></s>Сер</div><div class="n"><s style="height:68px"></s>Вер</div><div class="n"><s style="height:65px"></s>Жов</div>
          </div>
        </div>
      </div>
    </main>
  </div>
</template>

<template id="term">
  <div class="term ff">
    <div class="term__bar"><span class="dots"><i></i><i></i><i></i></span>gitlab-ci · pipeline #4812 · main</div>
<pre><span class="p">➜</span> <span class="w">git push</span> origin main
<span class="m">Pipeline #4812 запущено для a3f9c21</span>
  <span class="p">✓</span> build             <span class="m">1m 12s</span>

  </div>
</template>

<div class="stage">
  <div class="scene cover" data-shot="cover">
    <div class="tilt"><div class="browser"><div class="browser__bar dark"><span class="dots"><i></i><i></i><i></i></span><span class="url">ops.agronova.ua</span></div><div data-clone="dash"></div></div></div>
    <div data-clone="term"></div>
    <div class="chip ff"><i>0</i><div><small>Простоїв за сезон жнив</small><b>120 тис. га без зупинок</b></div></div>
  </div>
  <div class="scene flat" data-shot="dashboard">
    <div class="browser"><div class="browser__bar dark"><span class="dots"><i></i><i></i><i></i></span><span class="url">ops.agronova.ua</span></div><div data-clone="dash"></div></div>
  </div>
</div>

<script>
  (function () {
    const el = document.getElementById("dash").content.getElementById("nodes");
    const v = [42, 58, 71, 64, 38, 55, 82, 67, 49, 61, 74, 45, 52, 69, 57, 63, 48, 77, 0, 0, 0, 0, 0, 0];
    el.innerHTML = v.map((x) => x
      ? `<i style="background:color-mix(in srgb, ${x > 75 ? "#ffc24b" : "#9ae65c"} ${40 + x * .6}%, #17201b)">${x}%</i>`
      : `<i style="background:#17201b;border:1px dashed #2a3530;color:#56635b">—</i>`).join("");
  })();
</script>
<script src="shared.js"></script>
<script>
  // термінал у сцені обкладинки має абсолютну позицію
  document.querySelector(".cover > [data-clone=term] .term").style.cssText = "position:absolute;z-index:5;left:40px;top:430px;transform:rotate(-2deg)";
  document.querySelector(".cover > [data-clone=term]").style.cssText = "position:absolute;inset:0;pointer-events:none";
</script>
